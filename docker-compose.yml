services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finconecta-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aidocs}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-aidocs}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend & frontend services are added in Phase 4 (see PLAN.md)

volumes:
  db-data:
